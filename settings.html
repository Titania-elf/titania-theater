<!-- settings.html -->
<div class="inline-drawer" id="titania-settings-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <div class="titania-header-main">
            <b>回声工具箱</b>
            <span id="titania-version-badge" class="titania-version-badge"></span>
            <span id="titania-new-badge" class="titania-new-badge" style="display:none;">NEW</span>
        </div>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>

    <div class="inline-drawer-content">
        <div class="titania-panel-grid">
            <section class="titania-panel-card">
                <div class="titania-card-title"><i class="fa-solid fa-sliders"></i> 快速开关</div>

                <label class="checkbox_label titania-switch-row">
                    <input id="enable_echo_theater" type="checkbox" />
                    <span class="titania-switch-text">
                        <span class="titania-switch-main">显示悬浮球</span>
                        <small>开启后在屏幕边缘显示 🎭 悬浮球，也可从发送键菜单进入回声小剧场。</small>
                    </span>
                </label>

                <label class="checkbox_label titania-switch-row">
                    <input id="cfg-outline-entry-enabled" type="checkbox" />
                    <span class="titania-switch-text">
                        <span class="titania-switch-main">启用发送键菜单入口</span>
                        <small>在发送按钮旁显示菜单入口，故事大纲/细纲情节/回声小剧场等功能从该菜单进入。</small>
                    </span>
                </label>

                <label class="checkbox_label titania-switch-row">
                    <input id="cfg-rewrite-entry-enabled" type="checkbox" />
                    <span class="titania-switch-text">
                        <span class="titania-switch-main">启用文本改写入口</span>
                        <small>在发送键菜单中显示「文本改写」项。</small>
                    </span>
                </label>

                <label class="checkbox_label titania-switch-row">
                    <input id="cfg-toolbar-lore-enabled" type="checkbox" />
                    <span class="titania-switch-text">
                        <span class="titania-switch-main">启用提取设定快捷入口</span>
                        <small>在发送键菜单中显示「提取设定」项。</small>
                    </span>
                </label>

                <label class="checkbox_label titania-switch-row">
                    <input id="cfg-toolbar-recall-enabled" type="checkbox" />
                    <span class="titania-switch-text">
                        <span class="titania-switch-main">启用记忆召回快捷入口</span>
                        <small>在发送键菜单中显示「记忆召回」项。</small>
                    </span>
                </label>
            </section>

            <section class="titania-panel-card" id="titania-update-section" style="display:none;">
                <div class="titania-card-title"><i class="fa-solid fa-rocket"></i> 版本更新</div>
                <div class="titania-update-info">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>发现新版本 <b id="titania-remote-version"></b></span>
                </div>
                <button id="titania-update-btn" class="titania-update-btn">
                    <i class="fa-solid fa-eye"></i> 查看更新
                </button>
            </section>
        </div>
    </div>
</div>

<style>
    #titania-settings-drawer .inline-drawer-content {
        padding-top: 10px;
    }

    .titania-header-main {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }

    .titania-panel-grid {
        display: grid;
        gap: 10px;
    }

    .titania-panel-card {
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015));
    }

    .titania-card-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 700;
        color: #d8e4f0;
    }

    .titania-switch-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 8px;
    }

    .titania-switch-row:last-child {
        margin-bottom: 0;
    }

    .titania-switch-text {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }

    .titania-switch-main {
        color: #dce7f3;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
    }

    .titania-switch-text small {
        color: #93a8bb;
        line-height: 1.4;
        font-size: 11px;
    }

    .titania-version-badge {
        background: rgba(100, 100, 100, 0.3);
        color: #888;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
    }

    .titania-new-badge {
        background: linear-gradient(135deg, #00b894, #00cec9);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        cursor: pointer;
        animation: titania-bounce 1s ease-in-out infinite;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        box-shadow: 0 2px 8px rgba(0, 184, 148, 0.35);
    }

    @keyframes titania-bounce {
        0%,
        100% {
            transform: translateY(0) scale(1);
        }

        50% {
            transform: translateY(-2px) scale(1.04);
        }
    }

    .titania-update-info {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #00b894;
        font-size: 12px;
        margin-bottom: 8px;
    }

    .titania-update-btn {
        background: linear-gradient(135deg, #00b894, #00cec9);
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: all 0.2s;
    }

    .titania-update-btn:hover {
        filter: brightness(1.08);
    }

    .titania-update-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: titania-fadeIn 0.2s;
    }

    @keyframes titania-fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .titania-update-dialog {
        background: #1e1e1e;
        border: 1px solid #444;
        border-radius: 12px;
        width: 480px;
        max-width: 90vw;
        max-height: 80vh;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .titania-update-header {
        padding: 15px 20px;
        background: linear-gradient(135deg, #00b894, #00cec9);
        color: #fff;
        font-weight: 700;
        font-size: 1.1em;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .titania-update-close {
        cursor: pointer;
        font-size: 1.5em;
        opacity: 0.8;
    }

    .titania-update-close:hover {
        opacity: 1;
    }

    .titania-update-body {
        padding: 20px;
        max-height: 400px;
        overflow-y: auto;
        color: #ccc;
        line-height: 1.6;
    }

    .titania-version-compare {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        padding: 15px;
        background: #252525;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .titania-version-box { text-align: center; }
    .titania-version-label { font-size: 0.8em; color: #888; margin-bottom: 5px; }
    .titania-version-num { font-size: 1.3em; font-weight: 700; }
    .titania-version-num.old { color: #888; }
    .titania-version-num.new { color: #00b894; }
    .titania-version-arrow { color: #00b894; font-size: 1.5em; }

    .titania-changelog-title {
        font-weight: 700;
        margin-bottom: 10px;
        color: #ccc;
    }

    .titania-changelog-list {
        background: #252525;
        border-radius: 8px;
        padding: 15px;
        max-height: 200px;
        overflow-y: auto;
    }

    .titania-changelog-version {
        color: #00b894;
        font-weight: 700;
        margin-top: 10px;
        margin-bottom: 8px;
    }

    .titania-changelog-version:first-child {
        margin-top: 0;
    }

    .titania-changelog-content {
        padding-left: 10px;
        border-left: 2px solid #00b894;
        margin-bottom: 10px;
        line-height: 1.8;
    }

    .titania-update-footer {
        padding: 15px 20px;
        background: #181818;
        border-top: 1px solid #333;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }

    .titania-btn-cancel {
        background: #444;
        color: #ccc;
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    .titania-btn-cancel:hover {
        background: #555;
    }

    .titania-btn-confirm {
        background: linear-gradient(135deg, #00b894, #00cec9);
        color: #fff;
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .titania-btn-confirm:hover {
        filter: brightness(1.1);
    }

    .titania-btn-confirm:disabled,
    .titania-btn-cancel:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
</style>
